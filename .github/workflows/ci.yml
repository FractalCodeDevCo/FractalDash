name: FractalDash CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install dash plotly pandas numpy pyfractal nolds antropy pytest

      - name: Ejecutar pruebas (pytest)
        run: |
          pytest backend/algorithms/test_algorithms.py
